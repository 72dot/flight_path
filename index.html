<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Interactive Dot Globe</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100vw; height: 100vh;
      overflow: hidden;
      background: transparent !important;
      font-family: 'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      user-select: none;
    }
    #webgl-container, #webgl-container canvas {
      width: 100%; height: 100%;
      position: absolute; top: 0; left: 0;
      z-index: 1; background: transparent;
    }
    #webgl-container:active { cursor: grabbing; }
    /* 2D 글로우 레이어 스타일 */
    #globe-glow {
      position: absolute;
      top: 0; left: 0;
      border-radius: 50%;
      pointer-events: none;
      z-index: 0;
      /*
        원 안쪽: 중앙(완전투명 0%) -> 테두리(노란 글로우) 방사형 그라데이션
        - 35%: 35% 지점까지는 완전히 투명
        - 75%: 75% 지점부터 부드럽게 노란 빛 반사
        - 100%: 가장자리 지점 진한 글로우
      */
      background: radial-gradient(
        circle,
        rgba(190, 255, 240, 0) 35%,
        rgba(190, 255, 240, 0.25) 75%,
        rgba(190, 255, 240, 0.6) 100%
      );
      /*
        box-shadow: 원 바깥쪽으로 부드럽게 퍼지는 아우라 번짐 효과
        - 3번째 값 (예: 40px, 80px): blur (수치가 클수록 멀리 부드럽게 번짐)
        - 4번째 값 (예: 15px, 30px): spread (수치가 클수록 글로우 두께가 커짐)
      */
      box-shadow: 0 0 40px 15px rgba(190, 255, 240, 0.5),
                  0 0 80px 30px rgba(190, 255, 240, 0.28);
      transform: translate(-50%, -50%);
    }
    #click-label {
      position: absolute; z-index: 20;
      padding: 7px 16px;
      background: rgba(10, 18, 40, 0.88);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(56, 189, 248, 0.55);
      border-radius: 22px;
      font-size: 13px; font-weight: 600; color: #f0f8ff;
      pointer-events: none; opacity: 0;
      transform: translate(-50%, -100%);
      white-space: nowrap; letter-spacing: 0.02em;
      box-shadow: 0 6px 24px rgba(0,0,0,0.45), 0 0 14px rgba(56,189,248,0.25);
    }
    #loading {
      position: fixed; inset: 0;
      display: flex; align-items: center; justify-content: center;
      z-index: 100; color: rgba(148,163,184,0.85);
      font-size: 14px; letter-spacing: 0.05em; pointer-events: none;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/topojson-client@3/dist/topojson-client.min.js"></script>
  <script src="https://d3js.org/d3.v7.min.js"></script>
</head>
<body>
  <div id="webgl-container"></div>
  <div id="globe-glow"></div>
  <div id="click-label"></div>
  <div id="loading">Loading Globe ...</div>

  <script>
    // ============================================================
    // CONFIG
    // ============================================================
    const CONFIG = {
      globe: {
        radius:   100,
        dotCount: 180000,       // 도트 수
        landDotSize:  5.0,     // 육지 도트 크기
        oceanDotSize: 3.0,     // 바다 도트 크기
        landDotColor:  '#99b0d0',  // 육지 도트 색상
        landDotOpacity:  1.0,
        oceanDotColor: '#c0f2ff',  // 바다 도트 색상
        oceanDotOpacity: 0.8,
        backFadeStart:  0.05,  // dot-product 이 값 이하부터 페이드 시작
        backFadeEnd:   -0.35,  // 이 값 이하는 완전히 숨김
        backFadeMinAlpha: 0.0, // 뒷면 최소 투명도 (0 = 완전 투명)
      },
      ripple: {
        color: '#00c6fe', coreColor: '#9ae9ff',
        opacity: 0.9, ringSize: 2.0, maxScale: 3.0, speed: 0.0065, // ≈2.5초에 1사이클 (천천히 스무스한 모션)
      },
      arc: {
        lineColor: '#00c6fe', lineOpacity: 0.7,
        strokeWidth: 0.1,     // 비행경로 두께 조절 (Tube 반지름)
        pulseColor: '#00c6fe', pulseSize: 0.3,
        pulseSpeed: 0.005, heightScale: 0.30,

        // ── Arc 연결 모드 (아래 4가지 중 하나만 선택) ───────────────────
        // 'sequential' : 배열 순서대로 인접한 위치끼리만 연결 (현재 방식)
        // 'full'       : 모든 위치를 서로 완전 연결 (복잡한 거미줄)
        // 'hub'        : 첫 번째 위치(허브)에서 나머지 전체를 연결
        // 'knn'        : 각 위치에서 가장 가까운 K개 이웃만 연결
        connectMode: 'sequential',
        knnK: 3,              // 'knn' 모드에서 이웃 수 (기본값 3)
        hubIndex: 0,          // 'hub' 모드에서 허브로 쓸 LOCATIONS 인덱스
      },
      autoRotateSpeed: 0.25,
    };

    // ============================================================
    // 도시 데이터
    // ============================================================
    const LOCATIONS = [
      { country: 'Canada',       city: 'Toronto',   lat: 43.653, long: -79.383 },
      { country: 'USA',          city: 'Detroit',   lat: 42.331, long: -83.046 },
      { country: 'France',       city: 'Paris',     lat: 48.857, long:   2.352 },
      { country: 'Bulgaria',     city: 'Sofia',     lat: 42.698, long:  23.322 },
      { country: 'Saudi Arabia', city: 'Riyadh',    lat: 24.714, long:  46.675 },
      { country: 'UAE',          city: 'Abu Dhabi', lat: 24.454, long:  54.377 },
      { country: 'India',        city: 'Hyderabad', lat: 17.385, long:  78.487 },
      { country: 'Malaysia',     city: 'Penang',    lat:  5.414, long: 100.329 },
      { country: 'Singapore',    city: '',          lat:  1.352, long: 103.820 },
      { country: 'Vietnam',      city: 'Hanoi',     lat: 21.029, long: 105.854 },
      { country: 'Taiwan',       city: 'Taipei',    lat: 25.033, long: 121.565 },
      { country: 'South Korea',  city: 'Pangyo',    lat: 37.401, long: 127.109 },
      { country: 'Japan',        city: 'Tokyo',     lat: 35.676, long: 139.650 },
    ];

    // ============================================================
    // 전역 상태
    // ============================================================
    const container  = document.getElementById('webgl-container');
    const clickLabel = document.getElementById('click-label');
    const loadingEl  = document.getElementById('loading');

    let scene, camera, renderer, controls, globeGroup;
    let landMesh = null, oceanMesh = null;

    // arc / pin 페이드용 데이터 배열
    const arcData  = []; // { lineMat, pulse, pulseMat, startNorm, endNorm }
    const pinData  = []; // { posNorm, coreMat, rings, fade }

    const pinObjects = []; // raycaster 대상 (core mesh)
    const raycaster  = new THREE.Raycaster();
    const mouse      = new THREE.Vector2();
    let selectedObject = null;

    // 세계지도 pixel 배열 (빠른 isLand 조회)
    let mapPixels = null, mapW = 0, mapH = 0;

    // camDir 재사용 벡터
    const _camWorldDir  = new THREE.Vector3();
    const _camLocalDir  = new THREE.Vector3();
    const _invQuat      = new THREE.Quaternion();

    // ============================================================
    // 셰이더: GPU 측에서 카메라 방향 기반 per-vertex 페이드 처리
    // camDir uniform 하나만 갱신하면 GPU가 100,000개 점을 실시간 처리
    // ============================================================
    const VERT_SHADER = `
      uniform float ptSize;
      uniform vec3  camDir;      // 글로브 로컬 공간의 카메라 방향 (매 프레임 갱신)
      uniform float fadeStart;
      uniform float fadeEnd;
      uniform float minAlpha;
      uniform float baseAlpha;

      varying vec3  vColor;
      varying float vAlpha;

      void main() {
        vColor = color;

        // 점의 단위 법선 (구면이므로 position 방향 = 법선)
        vec3  n  = normalize(position);
        float dp = dot(n, camDir);
        // fadeEnd ~ fadeStart 구간에서 0 → 1 선형 보간
        float f  = clamp((dp - fadeEnd) / (fadeStart - fadeEnd), 0.0, 1.0);
        vAlpha   = minAlpha + f * (baseAlpha - minAlpha);

        vec4 mvPos   = modelViewMatrix * vec4(position, 1.0);
        // 원근 감쇠: 300은 카메라 거리 기준 보정값
        gl_PointSize = ptSize * (300.0 / -mvPos.z);
        gl_Position  = projectionMatrix * mvPos;
      }
    `;

    const FRAG_SHADER = `
      varying float vAlpha;
      varying vec3  vColor;

      void main() {
        // 완벽한 원형 마스킹 (텍스처 불필요)
        float dist = length(gl_PointCoord - vec2(0.5));
        if (dist > 0.5) discard;
        float aa = smoothstep(0.5, 0.38, dist);
        gl_FragColor = vec4(vColor, aa * vAlpha);
      }
    `;

    function makeDotMaterial(ptSize, baseAlpha) {
      return new THREE.ShaderMaterial({
        uniforms: {
          ptSize:    { value: ptSize },
          camDir:    { value: new THREE.Vector3(0, 0, 1) },
          fadeStart: { value: CONFIG.globe.backFadeStart },
          fadeEnd:   { value: CONFIG.globe.backFadeEnd },
          minAlpha:  { value: CONFIG.globe.backFadeMinAlpha },
          baseAlpha: { value: baseAlpha },
        },
        vertexShader:   VERT_SHADER,
        fragmentShader: FRAG_SHADER,
        transparent: true,
        depthWrite:  false,
        vertexColors: true,
      });
    }

    // ============================================================
    // 좌표 변환
    // ============================================================
    function latLonToVec3(lat, lon, r) {
      const phi   = (90  - lat) * (Math.PI / 180);
      const theta = (lon + 180) * (Math.PI / 180);
      return new THREE.Vector3(
        -r * Math.sin(phi) * Math.cos(theta),
         r * Math.cos(phi),
         r * Math.sin(phi) * Math.sin(theta),
      );
    }

    // 피보나치 구체 점 (xn,yn,zn) → lat/lon 역변환 (latLonToVec3 정확한 역함수)
    function vec3ToLatLon(xn, yn, zn) {
      const lat = Math.asin(Math.max(-1, Math.min(1, yn))) * (180 / Math.PI);
      let lon = Math.atan2(zn, -xn) * (180 / Math.PI) - 180;
      if (lon < -180) lon += 360;
      if (lon >  180) lon -= 360;
      return { lat, lon };
    }

    // ============================================================
    // 세계지도 로드 (TopoJSON → 오프스크린 캔버스 → 픽셀 배열)
    // getImageData 1회 호출로 전체 픽셀을 배열에 캐시 → isLand O(1)
    // ============================================================
    async function loadWorldMap() {
      try {
        const res   = await fetch('https://cdn.jsdelivr.net/npm/world-atlas@2/land-50m.json');
        const topo  = await res.json();
        const land  = topojson.feature(topo, topo.objects.land);

        mapW = 4096; mapH = 2048;
        const cv = document.createElement('canvas');
        cv.width = mapW; cv.height = mapH;
        const ctx = cv.getContext('2d');

        // D3로 정확한 Equirectangular 투영 적용 (anti-meridian 래핑 문제 해결)
        const projection = d3.geoEquirectangular()
          .translate([mapW / 2, mapH / 2])
          .scale(mapW / (2 * Math.PI));

        const path = d3.geoPath()
          .projection(projection)
          .context(ctx);

        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, mapW, mapH);
        
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        path(land);
        ctx.fill();

        // 픽셀 전체를 1회만 읽어 배열에 캐시
        mapPixels = ctx.getImageData(0, 0, mapW, mapH).data;
        return true;
      } catch (e) {
        console.warn('TopoJSON 로드 실패, 폴백 사용:', e);
        return false;
      }
    }

    function buildFallbackMap() {
      mapW = 2048; mapH = 1024;
      const cv = document.createElement('canvas');
      cv.width = mapW; cv.height = mapH;
      const ctx = cv.getContext('2d');
      ctx.fillStyle = '#000'; ctx.fillRect(0, 0, mapW, mapH);
      ctx.fillStyle = '#fff';
      const p = pts => {
        ctx.beginPath();
        pts.forEach(([x,y],i) => i===0 ? ctx.moveTo(x,y) : ctx.lineTo(x,y));
        ctx.closePath(); ctx.fill();
      };
      p([[210,130],[480,120],[560,200],[550,320],[460,420],[290,380],[210,260]]);
      p([[400,440],[560,470],[590,650],[560,780],[510,870],[440,860],[390,650]]);
      p([[930,120],[1310,110],[1310,150],[1280,300],[1200,310],[950,290]]);
      p([[940,310],[1270,315],[1240,720],[1160,800],[1020,700],[940,470]]);
      p([[1180,120],[1900,100],[1920,160],[1900,470],[1600,530],[1400,470],[1270,310],[1180,220]]);
      p([[1530,560],[1850,545],[1870,820],[1620,860],[1490,720]]);
      mapPixels = ctx.getImageData(0, 0, mapW, mapH).data;
    }

    // O(1) 육지 판별 (캐시된 픽셀 배열 직접 접근)
    function isLand(lat, lon) {
      if (!mapPixels) return false;
      const cx = Math.max(0, Math.min(mapW-1, Math.floor(((lon+180)/360)*mapW)));
      const cy = Math.max(0, Math.min(mapH-1, Math.floor(((90-lat)/180)*mapH)));
      return mapPixels[(cy * mapW + cx) * 4] > 128;
    }

    // ============================================================
    // Three.js 씬 초기화
    // ============================================================
    function initScene() {
      scene  = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 1, 2000);
      camera.position.set(0, 0, 215); // 지구본을 확대하기 위해 카메라 거리를 가깝게 조정 (340 -> 240)

      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setClearColor(0x000000, 0);
      renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
      renderer.setSize(innerWidth, innerHeight);
      container.appendChild(renderer.domElement);

      controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.06;
      controls.rotateSpeed   = 0.65;
      controls.enableZoom    = false;
      controls.enablePan     = false;
      controls.minPolarAngle = Math.PI / 2;
      controls.maxPolarAngle = Math.PI / 2;
      // 터치 이벤트는 capture phase 인터셉터가 완전히 차단하므로 별도 설정 불필요

      globeGroup = new THREE.Group();
      scene.add(globeGroup);
      scene.add(new THREE.AmbientLight(0xffffff, 1.0));
    }

    // ============================================================
    // 도트 지구본 생성
    // ============================================================
    function buildDotGlobe() {
      const R   = CONFIG.globe.radius;
      // 스마트폰 환경(화면 너비 690px 미만)일 경우 도트 수를 절반으로 조정하여 성능 최적화
      const isMobilePhone = window.innerWidth < 690;
      const N   = isMobilePhone ? Math.floor(CONFIG.globe.dotCount / 2) : CONFIG.globe.dotCount;
      const PHI = (1 + Math.sqrt(5)) / 2;

      const landPos = [], landCol = [];
      const seaPos  = [], seaCol  = [];

      const lC = new THREE.Color(CONFIG.globe.landDotColor);
      const sC = new THREE.Color(CONFIG.globe.oceanDotColor);

      for (let i = 0; i < N; i++) {
        const yn = 1 - (i / (N-1)) * 2;
        const rn = Math.sqrt(Math.max(0, 1 - yn*yn));
        const th = 2 * Math.PI * i / PHI;

        const xn = Math.cos(th) * rn;
        const zn = Math.sin(th) * rn;

        const { lat, lon } = vec3ToLatLon(xn, yn, zn);

        if (isLand(lat, lon)) {
          landPos.push(xn*R, yn*R, zn*R);
          landCol.push(lC.r, lC.g, lC.b);
        } else {
          seaPos.push(xn*R, yn*R, zn*R);
          seaCol.push(sC.r, sC.g, sC.b);
        }
      }

      // 스마트폰 환경에서 도트 크기 2/3 축소 적용
      const landSize  = isMobilePhone ? CONFIG.globe.landDotSize * (2 / 3) : CONFIG.globe.landDotSize;
      const oceanSize = isMobilePhone ? CONFIG.globe.oceanDotSize * (2 / 3) : CONFIG.globe.oceanDotSize;

      // 육지 도트
      const lg = new THREE.BufferGeometry();
      lg.setAttribute('position', new THREE.Float32BufferAttribute(landPos, 3));
      lg.setAttribute('color',    new THREE.Float32BufferAttribute(landCol, 3));
      landMesh = new THREE.Points(lg, makeDotMaterial(landSize, CONFIG.globe.landDotOpacity));
      globeGroup.add(landMesh);

      // 바다 도트
      const sg = new THREE.BufferGeometry();
      sg.setAttribute('position', new THREE.Float32BufferAttribute(seaPos, 3));
      sg.setAttribute('color',    new THREE.Float32BufferAttribute(seaCol, 3));
      oceanMesh = new THREE.Points(sg, makeDotMaterial(oceanSize, CONFIG.globe.oceanDotOpacity));
      globeGroup.add(oceanMesh);
    }

    // ============================================================
    // 도시 핀 (파동 원형) 생성
    // ============================================================

    // Canvas 방사형 그라데이션 텍스처 생성 (1회만 호출, GPU에 캐시)
    // 중심→가장자리: 투명 → 불투명(링 밴드) → 투명 으로 매핑하여 시각적 도넛 형태 구현
    function createRippleTexture(colorHex, size) {
      const sz = size || 256;
      const canvas = document.createElement('canvas');
      canvas.width = sz; canvas.height = sz;
      const ctx = canvas.getContext('2d');
      const cx = sz / 2, cy = sz / 2, r = sz / 2;

      // 방사형 그라데이션 (중심 → 가장자리)
      const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, r);
      //  0%~55% : 완전 투명 (가운데 빈 공간)
      // 55%~75% : 부드럽게 불투명 전환 (안쪽 경계 페이드인)
      // 75%~88% : 최대 불투명 (링의 밝은 밴드)
      // 88%~100%: 서서히 투명 (바깥쪽 경계 페이드아웃)
      const c = new THREE.Color(colorHex);
      const r8 = Math.round(c.r * 255), g8 = Math.round(c.g * 255), b8 = Math.round(c.b * 255);
      grad.addColorStop(0,    `rgba(${r8},${g8},${b8}, 0)`);
      grad.addColorStop(0.55, `rgba(${r8},${g8},${b8}, 0)`);
      grad.addColorStop(0.72, `rgba(${r8},${g8},${b8}, 0.6)`);
      grad.addColorStop(0.82, `rgba(${r8},${g8},${b8}, 1.0)`);
      grad.addColorStop(0.92, `rgba(${r8},${g8},${b8}, 0.5)`);
      grad.addColorStop(1.0,  `rgba(${r8},${g8},${b8}, 0)`);

      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, sz, sz);

      const tex = new THREE.CanvasTexture(canvas);
      tex.needsUpdate = true;
      return tex;
    }

    // 텍스처 캐시 (색상별 1장만 생성)
    let rippleTexDefault = null;
    let rippleTexSingapore = null;

    function createPins() {
      const R = CONFIG.globe.radius;

      // 텍스처 1회 생성 (GPU 캐시)
      if (!rippleTexDefault)   rippleTexDefault   = createRippleTexture(CONFIG.ripple.color, 256);
      if (!rippleTexSingapore) rippleTexSingapore = createRippleTexture('#005cfe', 256);

      LOCATIONS.forEach(loc => {
        const isSingapore = loc.country.toLowerCase() === 'singapore';
        const scaleFactor = isSingapore ? 1.0 : 0.6;

        const worldPos = latLonToVec3(loc.lat, loc.long, R + 1.0);
        const posNorm  = worldPos.clone().normalize();

        const grp = new THREE.Group();
        grp.position.copy(worldPos);
        grp.quaternion.setFromUnitVectors(new THREE.Vector3(0, 0, 1), posNorm);

        // 색상 설정 (싱가포르: 파란 계열, 나머지: 기존 하늘색 계열)
        const coreColorHex = isSingapore ? '#469dff' : CONFIG.ripple.coreColor;
        const rippleTex    = isSingapore ? rippleTexSingapore : rippleTexDefault;

        // 중심 코어
        const coreMat = new THREE.MeshBasicMaterial({
          color: new THREE.Color(coreColorHex),
          side: THREE.DoubleSide,
          transparent: true,
          opacity: 1.0,
          depthTest: false,
        });
        const core = new THREE.Mesh(new THREE.CircleGeometry(1.4 * scaleFactor, 32), coreMat);
        core.renderOrder = 11;
        grp.add(core);

        // ripple 최대 범위와 동일한 크기의 클릭 영역
        const maxRippleRadius = CONFIG.ripple.ringSize * CONFIG.ripple.maxScale * scaleFactor;
        const hitMat  = new THREE.MeshBasicMaterial({ visible: false });
        const hitMesh = new THREE.Mesh(new THREE.CircleGeometry(maxRippleRadius, 32), hitMat);
        hitMesh.userData = loc;
        grp.add(hitMesh);
        pinObjects.push(hitMesh);

        // 파동 원형판 2개 (Canvas 방사형 그라데이션 텍스처 적용)
        const rings = [];
        for (let i = 0; i < 2; i++) {
          const discMat = new THREE.MeshBasicMaterial({
            map: rippleTex,
            transparent: true,
            opacity: CONFIG.ripple.opacity,
            side: THREE.DoubleSide,
            depthTest: false,
          });
          const discRadius = CONFIG.ripple.ringSize * scaleFactor;
          const disc = new THREE.Mesh(new THREE.CircleGeometry(discRadius, 64), discMat);
          disc.userData = { phase: i * 0.5 };
          disc.renderOrder = 10;
          grp.add(disc);
          rings.push(disc);
        }

        globeGroup.add(grp);

        pinData.push({ posNorm, coreMat, rings, fade: 1.0 });
      });
    }

    // ============================================================
    // 포물선 곡선 (Cubic Bezier Arc) + 흐르는 입자
    // ============================================================
    function createArcs() {
      const R    = CONFIG.globe.radius;
      const mode = CONFIG.arc.connectMode;
      const locs = LOCATIONS;
      const N    = locs.length;
      const drawn = new Set(); // 중복 방지용 (양방향 동일 선 제거)

      function tryDraw(i, j) {
        const key = i < j ? `${i}-${j}` : `${j}-${i}`;
        if (drawn.has(key)) return;
        drawn.add(key);
        _drawArc(locs[i], locs[j], R);
      }

      if (mode === 'sequential') {
        // ① 인접한 위치끼리 순차 연결 (기존 방식)
        for (let i = 0; i < N; i++) {
          tryDraw(i, (i + 1) % N);
          if (i % 2 === 0) tryDraw(i, (i + 4) % N);
        }

      } else if (mode === 'full') {
        // ② 모든 위치 쌍 완전 연결
        for (let i = 0; i < N; i++)
          for (let j = i + 1; j < N; j++)
            tryDraw(i, j);

      } else if (mode === 'hub') {
        // ③ 허브 위치 → 나머지 전체 연결
        const h = CONFIG.arc.hubIndex % N;
        for (let i = 0; i < N; i++)
          if (i !== h) tryDraw(h, i);

      } else if (mode === 'knn') {
        // ④ 각 위치에서 가장 가까운 K개 이웃만 연결
        const K = CONFIG.arc.knnK;
        const pts = locs.map(l => latLonToVec3(l.lat, l.long, R));
        for (let i = 0; i < N; i++) {
          // 다른 위치까지 거리 계산 후 정렬
          const neighbors = [];
          for (let j = 0; j < N; j++) {
            if (j === i) continue;
            neighbors.push({ j, dist: pts[i].distanceTo(pts[j]) });
          }
          neighbors.sort((a, b) => a.dist - b.dist);
          neighbors.slice(0, K).forEach(nb => tryDraw(i, nb.j));
        }
      }
    }

    function _drawArc(locA, locB, R) {
      const pA = latLonToVec3(locA.lat, locA.long, R);
      const pB = latLonToVec3(locB.lat, locB.long, R);

      // 두 끝점의 단위 법선 (페이드 판별에 사용)
      const startNorm = pA.clone().normalize();
      const endNorm   = pB.clone().normalize();

      const dist = pA.distanceTo(pB);
      const maxDist = 2 * R;
      const heightFactor = 0.08 + (dist / maxDist) * 0.35;
      const arcHeight = R + dist * heightFactor;

      // 3차 입체 베지어 곡선 (Cubic Bezier Curve) - 시작/끝점 핸들러(조종점 2개) 설정
      // pA에서 1/3 지점, 2/3 지점에 양쪽 제어점(Control Points) 배치
      const cp1 = new THREE.Vector3().lerpVectors(pA, pB, 0.33).normalize().multiplyScalar(arcHeight);
      const cp2 = new THREE.Vector3().lerpVectors(pA, pB, 0.67).normalize().multiplyScalar(arcHeight);

      const curve = new THREE.CubicBezierCurve3(pA, cp1, cp2, pB);

      const tubeGeo = new THREE.TubeGeometry(curve, 64, CONFIG.arc.strokeWidth || 0.4, 8, false);
      const lineMat = new THREE.MeshBasicMaterial({
        color: new THREE.Color(CONFIG.arc.lineColor),
        transparent: true,
        opacity: CONFIG.arc.lineOpacity,
      });
      globeGroup.add(new THREE.Mesh(tubeGeo, lineMat));

      const pulseMat = new THREE.MeshBasicMaterial({
        color: new THREE.Color(CONFIG.arc.pulseColor),
        transparent: true,
        opacity: 1.0,
      });
      const pulse = new THREE.Mesh(
        new THREE.SphereGeometry(CONFIG.arc.pulseSize, 12, 12),
        pulseMat
      );
      pulse.userData = { curve, progress: Math.random(), speed: CONFIG.arc.pulseSpeed + Math.random()*0.003 };
      globeGroup.add(pulse);

      arcData.push({ lineMat, pulse, pulseMat, startNorm, endNorm });
    }

    // ============================================================
    // 페이드 갱신 (매 프레임 호출 — 비용 최소화)
    //
    // [도트] camDir uniform만 업데이트 → GPU 셰이더가 100,000개 처리
    // [arc/ripple] 엔드포인트 dot product로 opacity만 갱신 (O(N), N=작음)
    //
    // 핵심: camera.position을 기준으로 하므로
    //   - 글로브 자동 회전 시에도 ✓
    //   - 마우스 드래그(카메라 궤도 이동) 시에도 ✓ 정확히 작동
    // ============================================================
    function updateFade() {
      // 카메라→원점 방향을 글로브 로컬 공간으로 변환
      _camWorldDir.copy(camera.position).normalize();
      _invQuat.copy(globeGroup.quaternion).invert();
      _camLocalDir.copy(_camWorldDir).applyQuaternion(_invQuat);

      // 도트 셰이더 uniform 갱신 (단 2번의 uniform 업데이트로 GPU 처리)
      if (landMesh)  landMesh.material.uniforms.camDir.value.copy(_camLocalDir);
      if (oceanMesh) oceanMesh.material.uniforms.camDir.value.copy(_camLocalDir);

      // 페이드 값 계산 헬퍼
      const fs = CONFIG.globe.backFadeStart;
      const fe = CONFIG.globe.backFadeEnd;
      const ma = CONFIG.globe.backFadeMinAlpha;
      const computeFade = dp => {
        const f = Math.max(0, Math.min(1, (dp - fe) / (fs - fe)));
        return ma + f * (1 - ma);
      };

      // arc 페이드 — 양 끝점의 평균 가시성으로 판단
      arcData.forEach(d => {
        const dp = (d.startNorm.dot(_camLocalDir) + d.endNorm.dot(_camLocalDir)) * 0.5;
        const f  = computeFade(dp);
        d.lineMat.opacity  = f * CONFIG.arc.lineOpacity;
        d.pulseMat.opacity = f * 0.92;
        d.lineMat.visible  = f > 0.005;
        d.pulse.visible    = f > 0.005;
      });

      // pin / ripple 페이드
      pinData.forEach(pd => {
        const dp   = pd.posNorm.dot(_camLocalDir);
        pd.fade    = computeFade(dp);
        pd.coreMat.opacity = pd.fade;
        pd.coreMat.visible = pd.fade > 0.005;
      });
    }

    // ============================================================
    // 클릭 라벨 위치 추적 (3D → 2D)
    // ============================================================
    function updateLabelPos() {
      if (!selectedObject) return;
      const wp = new THREE.Vector3();
      if (selectedObject.parent) {
        selectedObject.parent.getWorldPosition(wp);
      } else {
        selectedObject.getWorldPosition(wp);
      }

      const camDir = new THREE.Vector3();
      camera.getWorldDirection(camDir);
      const toPin = wp.clone().sub(camera.position).normalize();
      if (toPin.dot(camDir) < 0) { clickLabel.style.visibility = 'hidden'; return; }
      clickLabel.style.visibility = 'visible';

      const sp = wp.clone().project(camera);
      clickLabel.style.left = `${(sp.x * 0.5 + 0.5) * innerWidth}px`;
      clickLabel.style.top  = `${(-sp.y * 0.5 + 0.5) * innerHeight - 36}px`;
    }

    // ============================================================
    // 애니메이션 루프
    // ============================================================
    function animate(t) {
      requestAnimationFrame(animate);
      controls.update();
      globeGroup.rotation.y += CONFIG.autoRotateSpeed * 0.002;
      applyTouchInertia(); // 모바일 터치 관성 회전

      // ★ 페이드 갱신 — 매 프레임 (camDir uniform만 바꾸면 GPU가 처리하므로 비용 저렴)
      updateFade();

      // 파동 원형판 애니메이션 (그라데이션 텍스처 기반: 작게 시작 → 확대, 투명→불투명→투명)
      pinData.forEach(pd => {
        const f = pd.fade;
        pd.rings.forEach(disc => {
          disc.userData.phase += CONFIG.ripple.speed;
          if (disc.userData.phase > 1) disc.userData.phase -= 1;
          const p = disc.userData.phase;

          // 0.3x에서 시작 → maxScale까지 부드럽게 확대
          const s = 0.3 + p * (CONFIG.ripple.maxScale - 0.3);
          disc.scale.set(s, s, 1);

          // 투명도: 0% → 100% → 0% (벨 커브, sin 곡선 기반)
          const discAlpha = Math.sin(p * Math.PI);
          disc.material.opacity = discAlpha * CONFIG.ripple.opacity * f;
          disc.material.visible = f > 0.005 && discAlpha > 0.005;
        });
      });

      // 포물선 입자 이동
      arcData.forEach(d => {
        if (!d.pulse.visible) return;
        d.pulse.userData.progress += d.pulse.userData.speed;
        if (d.pulse.userData.progress > 1) d.pulse.userData.progress = 0;
        d.pulse.position.copy(d.pulse.userData.curve.getPoint(d.pulse.userData.progress));
      });

      if (selectedObject) updateLabelPos();

      renderer.render(scene, camera);
    }

    // ============================================================
    // 이벤트: 데스크톱 (마우스)
    // ============================================================
    function onPointerDown(e) {
      // 터치 이벤트는 별도 핸들러에서 처리하므로 무시
      if (e.pointerType === 'touch') return;

      mouse.x =  (e.clientX/innerWidth)  * 2 - 1;
      mouse.y = -(e.clientY/innerHeight) * 2 + 1;
      raycaster.setFromCamera(mouse, camera);

      const hits = raycaster.intersectObjects(pinObjects);
      if (hits.length > 0) {
        const obj  = hits[0].object;
        const data = obj.userData;
        selectedObject = obj;
        clickLabel.textContent = data.city ? `${data.country} — ${data.city}` : data.country;
        clickLabel.style.visibility = 'visible';
        updateLabelPos();
        gsap.fromTo(clickLabel,
          { opacity: 0, y: 8 },
          { opacity: 1, y: 0, duration: 0.22, ease: 'power2.out' }
        );
      }
    }

    function onPointerMove(e) {
      if (e.pointerType === 'touch') return;

      mouse.x =  (e.clientX/innerWidth)  * 2 - 1;
      mouse.y = -(e.clientY/innerHeight) * 2 + 1;
      raycaster.setFromCamera(mouse, camera);
      const isHoveringPin = raycaster.intersectObjects(pinObjects).length > 0;
      const targetCursor  = isHoveringPin ? 'default' : 'grab';

      container.style.cursor = targetCursor;
      if (renderer && renderer.domElement) {
        renderer.domElement.style.cursor = targetCursor;
      }
    }

    // ============================================================
    // 이벤트: 모바일 터치
    //
    // 핵심 원리:
    //   OrbitControls는 bubble 페이즈에서 터치 이벤트를 받아 preventDefault() 호출.
    //   우리는 capture 페이즈(bubble보다 먼저 실행)에서 stopImmediatePropagation()으로
    //   OrbitControls에게 이벤트가 전달되기 전에 완전히 차단한다.
    //
    // 동작 규칙:
    //   - 지구 내부 터치 → 좌우 드래그만 지구 회전 / 상하는 스크롤
    //   - 지구 외부 터치 → 무조건 브라우저 기본 스크롤
    // ============================================================
    const TOUCH_ROTATE_SPEED = 0.005;
    const INERTIA_DECAY      = 0.92;

    let touch = {
      active:   false,
      onGlobe:  false,
      startX:   0, startY: 0,
      lastX:    0,
      velocity: 0,
      dir:      null,   // null | 'h' | 'v'  (방향 확정 후 고정)
    };

    function getGlobeScreenRadius() {
      const cw = new THREE.Vector3();
      globeGroup.getWorldPosition(cw);
      const pc = cw.clone().project(camera);
      const cx = (pc.x * 0.5 + 0.5) * window.innerWidth;
      const cy = (-pc.y * 0.5 + 0.5) * window.innerHeight;

      const ew = cw.clone().add(new THREE.Vector3(CONFIG.globe.radius, 0, 0));
      const pe = ew.project(camera);
      const ex = (pe.x * 0.5 + 0.5) * window.innerWidth;
      const ey = (-pe.y * 0.5 + 0.5) * window.innerHeight;
      const rPx = Math.hypot(ex - cx, ey - cy);
      return { cx, cy, rPx };
    }

    function touchOnGlobe(tx, ty) {
      const { cx, cy, rPx } = getGlobeScreenRadius();
      return Math.hypot(tx - cx, ty - cy) <= rPx * 1.05;
    }

    function mTouch_Start(e) {
      e.stopImmediatePropagation(); // OrbitControls bubble 핸들러 차단
      if (e.touches.length !== 1) return;
      const t = e.touches[0];
      touch.active  = true;
      touch.onGlobe = touchOnGlobe(t.clientX, t.clientY);
      touch.startX  = t.clientX;
      touch.startY  = t.clientY;
      touch.lastX   = t.clientX;
      touch.velocity = 0;
      touch.dir      = null;

      // 핀 탭 판별
      mouse.x =  (t.clientX / innerWidth)  * 2 - 1;
      mouse.y = -(t.clientY / innerHeight) * 2 + 1;
      raycaster.setFromCamera(mouse, camera);
      const hits = raycaster.intersectObjects(pinObjects);
      if (hits.length > 0) {
        const data = hits[0].object.userData;
        selectedObject = hits[0].object;
        clickLabel.textContent = data.city ? `${data.country} — ${data.city}` : data.country;
        clickLabel.style.visibility = 'visible';
        updateLabelPos();
        
        // GSAP이 transform 속성을 건드리지 못하게 하여 픽셀 캐싱 버그 원천 차단 (marginTop으로 통통 튀는 효과 대체)
        gsap.fromTo(clickLabel, { opacity: 0, marginTop: 8 }, { opacity: 1, marginTop: 0, duration: 0.22, ease: 'power2.out' });
      }
    }

    function mTouch_Move(e) {
      e.stopImmediatePropagation(); // OrbitControls bubble 핸들러 차단

      if (!touch.active || e.touches.length !== 1) return;
      const t = e.touches[0];
      const dx = t.clientX - touch.startX;
      const dy = t.clientY - touch.startY;

      // 방향 미확정: 10px 이상 움직여야 판별
      if (touch.dir === null) {
        if (Math.hypot(dx, dy) < 10) return;
        touch.dir = Math.abs(dx) > Math.abs(dy) ? 'h' : 'v';
      }

      if (touch.dir === 'h' && touch.onGlobe) {
        // 지구 위에서 수평 드래그 → 회전
        e.preventDefault(); // 이 경우만 스크롤 차단
        const delta = t.clientX - touch.lastX;
        touch.velocity = delta * TOUCH_ROTATE_SPEED;
        globeGroup.rotation.y += touch.velocity;
        touch.lastX = t.clientX;
      }
      // 그 외(수직 or 지구 밖 수평) → preventDefault 미호출 → 브라우저 기본 스크롤
    }

    function mTouch_End(e) {
      e.stopImmediatePropagation();
      touch.active = false;
      touch.dir    = null;
    }

    function applyTouchInertia() {
      if (touch.active) return;
      if (Math.abs(touch.velocity) < 0.0001) { touch.velocity = 0; return; }
      globeGroup.rotation.y += touch.velocity;
      touch.velocity *= INERTIA_DECAY;
    }

    // 2D CSS 글로우 위치/크기 계산 (3D 지구본 직경 및 카메라 프로젝션과 100% 동일 동기화)
    // ※ project(camera)는 setViewOffset이 반영된 투영행렬을 사용하므로 별도 오프셋 보정 불필요
    function updateGlowPosition() {
      const glowEl = document.getElementById('globe-glow');
      if (!glowEl || !camera || !globeGroup) return;

      const R = CONFIG.globe.radius;
      const centerWorld = new THREE.Vector3();
      globeGroup.getWorldPosition(centerWorld);

      // 중심점 2D 프로젝션 좌표 (setViewOffset 반영된 투영행렬 사용 → 화면상 정확한 위치)
      const projCenter = centerWorld.clone().project(camera);
      const cx = (projCenter.x * 0.5 + 0.5) * window.innerWidth;
      const cy = (-projCenter.y * 0.5 + 0.5) * window.innerHeight;

      // 외곽 edge 2D 프로젝션으로 정확한 픽셀 반지름 계산
      const edgeWorld = centerWorld.clone().add(new THREE.Vector3(R, 0, 0));
      const projEdge  = edgeWorld.project(camera);
      const ex = (projEdge.x * 0.5 + 0.5) * window.innerWidth;
      const ey = (-projEdge.y * 0.5 + 0.5) * window.innerHeight;

      const rPx = Math.hypot(ex - cx, ey - cy);
      const scaleFactor = 1.13; // 글로우가 지구본보다 약간 더 크게 보이도록 1.13배 확대
      const diameter = rPx * 2 * scaleFactor;

      glowEl.style.width  = `${diameter}px`;
      glowEl.style.height = `${diameter}px`;
      glowEl.style.left   = `${cx}px`;
      glowEl.style.top    = `${cy}px`;
    }

    // 창 크기에 비례해 지구본 상단이 여백 없이 뷰포트 상단에 맞물리도록 시각적 뷰포트 오프셋 적용
    function updateGlobePosition() {
      const w = window.innerWidth;
      const h = window.innerHeight;

      const offsetY = -h * 0.35;

      camera.setViewOffset(w, h, 0, offsetY, w, h);
      camera.updateProjectionMatrix();
      updateGlowPosition();
    }

    function onResize() {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
      updateGlobePosition();
    }

    // ============================================================
    // 앱 시작
    // ============================================================
    async function startApp() {
      initScene();
      loadingEl.textContent = 'Loading Worldmap ...';

      const ok = await loadWorldMap();
      if (!ok) buildFallbackMap();

      loadingEl.textContent = 'Generating Dots ...';
      await new Promise(r => setTimeout(r, 30));

      buildDotGlobe();
      createPins();
      createArcs();
      updateGlobePosition();

      loadingEl.style.display = 'none';

      window.addEventListener('resize',      onResize);
      window.addEventListener('pointermove', onPointerMove);
      window.addEventListener('pointerdown', onPointerDown);

      // 모바일 터치: capture:true 로 OrbitControls의 bubble 핸들러보다 먼저 실행
      // touchmove 만 passive:false (지구 위 수평 드래그 시 preventDefault 필요)
      const cv = renderer.domElement;
      cv.addEventListener('touchstart', mTouch_Start, { capture: true, passive: true  });
      cv.addEventListener('touchmove',  mTouch_Move,  { capture: true, passive: false });
      cv.addEventListener('touchend',   mTouch_End,   { capture: true, passive: true  });

      animate(0);
    }

    // ============================================================
    // iframe → 부모 페이지 wheel 이벤트 중계
    // iframe 위에 마우스가 있을 때 부모 Lenis Smooth Scroll이 끊기는 문제 해결
    // ============================================================
    if (window.parent !== window) {
      window.addEventListener('wheel', (e) => {
        window.parent.postMessage({
          type: 'iframe-wheel',
          deltaY: e.deltaY,
          deltaX: e.deltaX,
        }, '*');
      }, { passive: true, capture: true }); // capture: true 로 OrbitControls보다 먼저 캡처
    }

    window.addEventListener('DOMContentLoaded', startApp);
  </script>
</body>
</html>
